spring.config.import=optional:configserver:

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

postali.url=https://postali.app

postali.validacion-obligatoria=true
spring.cloud.openfeign.client.config.postaliClient.connect-timeout=3000
spring.cloud.openfeign.client.config.postaliClient.read-timeout=5000
