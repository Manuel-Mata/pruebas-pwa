spring.config.import=optional:configserver:

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.jackson.deserialization.fail-on-unknown-properties=true

postali.url=https://postali.app

postali.validacion-obligatoria=true
spring.cloud.openfeign.client.config.postaliClient.connect-timeout=3000
spring.cloud.openfeign.client.config.postaliClient.read-timeout=5000

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

jwt.expiration-minutes=60
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Simulaciones GestoPago y Postali
gestopago.auth.url=http://localhost:9999
gestopago.auth.id-distribuidor=0
gestopago.auth.codigo-dispositivo=dev
gestopago.auth.password=dev
gestopago.catalogo.url=http://localhost:9999
postali.url=https://postali.app

# Timeouts del cliente de catálogo (ms)
gestopago.catalogo.connect-timeout-ms=5000
gestopago.catalogo.read-timeout-ms=30000
gestopago.catalogo.max-sincronizaciones-diarias=2

# Transacciones GestoPago (sendTx): URL real sobreescrita por la variable de entorno
# GESTOPAGO_TRANSACCION_URL en Render; localhost:9999 solo es el valor por defecto para
# cuando no está configurada.
gestopago.transaccion.url=${GESTOPAGO_TRANSACCION_URL:http://localhost:9999}
gestopago.transaccion.connect-timeout-ms=5000
gestopago.transaccion.read-timeout-ms=65000
gestopago.transaccion.unidad=${GESTOPAGO_UNIDAD:083}

# Encriptación AES-256-CBC del payload de sendTx (par de prueba del profesor por defecto;
# NUNCA usar estos valores por defecto en un ambiente real, sobreescribir con
# GESTOPAGO_SECRET_KEY / GESTOPAGO_IV)
gestopago.encriptacion.secret-key=${GESTOPAGO_SECRET_KEY:HPo7OLqB4Fkk4E2yGOtwqw8H5fHR9kNx67OR4g4UdlA=}
gestopago.encriptacion.iv=${GESTOPAGO_IV:p5ldmBPdd/9pjC0bDC/nSg==}
